{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<h2>My Profile</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card p-4">
            <h5>Personal Information</h5>
            <hr>
            <p><strong>Name:</strong> {{ user.name }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            
            <h5 class="mt-4">Academic Information</h5>
            <hr>
            <form method="post">
                <div class="mb-3">
                    <label>Department</label>
                    <input type="text" name="department" class="form-control" value="{{ profile.department or '' }}">
                </div>
                <div class="mb-3">
                    <label>Year</label>
                    <input type="text" name="year" class="form-control" value="{{ profile.year or '' }}">
                </div>
                <div class="mb-3">
                    <label>CGPA</label>
                    <input type="number" step="0.01" name="cgpa" class="form-control" value="{{ profile.cgpa or '' }}">
                </div>
                <div class="mb-3">
                    <label>Resume Link</label>
                    <input type="url" name="resume_link" class="form-control" value="{{ profile.resume_link or '' }}">
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
                <a href="/student/dashboard" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
